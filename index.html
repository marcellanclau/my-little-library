<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Little Library</title><meta name="theme-color" content="#171310"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="My Library"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#171310;--panel:#261c17;--wood:#40291d;--gold:#d7b875;--cream:#f2e4ca;--muted:#b6a58e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#3b2a20,var(--bg) 65%);color:var(--cream);font:15px Georgia,serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1000px;margin:auto;padding:28px 18px 80px}header{text-align:center;padding:15px 0 22px}.ornament{color:var(--gold);letter-spacing:8px}h1{font-size:clamp(31px,7vw,55px);font-weight:normal;letter-spacing:2px;margin:12px 0 4px}header p{color:var(--muted);font-style:italic;margin:5px}.line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:15px}input,select{background:#201813;color:var(--cream);border:1px solid #76573d;border-radius:7px;padding:12px;min-width:0}input::placeholder{color:#b3a28e}.search{flex:1;min-width:180px}.btn{background:linear-gradient(#d9bb7c,#a78142);color:#21170f;border:1px solid #e6c98c;border-radius:7px;padding:12px 15px;font-weight:bold}.btn.secondary{background:#302219;color:var(--gold);border-color:#7b5a35}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 25px;color:var(--muted)}.stats strong{color:var(--gold)}.shelf{padding:20px 12px 0;background:linear-gradient(90deg,#26180f,#422b1b 7%,#352218 50%,#422b1b 93%,#26180f);border:10px ridge #62432b;box-shadow:0 18px 25px #080605;border-radius:3px;min-height:230px}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:22px 15px;align-items:end}.book{background:none;border:0;color:var(--cream);text-align:center;padding:0;min-width:0}.cover{aspect-ratio:2/3;max-width:145px;margin:auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 9px;background:linear-gradient(125deg,#1117,#0000 24%),linear-gradient(150deg,var(--c1),var(--c2));border:2px solid #bfa16c;box-shadow:inset 4px 0 6px #0007,5px 7px 10px #0009;overflow:hidden}.cover:before{content:'✦';position:absolute;top:8px;left:10px;color:#e7cb8a}.cover:after{content:'❧';position:absolute;bottom:8px;right:10px;color:#e7cb8a}.cover .name{font-size:clamp(12px,2.4vw,17px);line-height:1.2;color:#f8eac9;text-shadow:1px 1px 3px #000}.cover .author{font:10px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#e9d8b6}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.book-label{display:block;font:12px Arial,sans-serif;color:#ddc9a8;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plank{height:18px;margin:15px -12px 0;background:linear-gradient(#91633d,#4e301d 35%,#21130e);border-top:2px solid #b88b54;box-shadow:0 9px 12px #0009}.empty{text-align:center;color:var(--muted);padding:50px 10px}.footer{text-align:center;color:var(--muted);font-style:italic;margin:25px 0}.modal-back{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal-back.open{display:flex}.modal{background:#281d17;border:1px solid #b18d57;border-radius:10px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #000}.modal h2{font-weight:normal;color:var(--gold);margin-top:0}.field{display:block;margin:12px 0;color:var(--muted)}.field input,.field select{display:block;width:100%;margin-top:6px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hint{color:var(--muted);font:12px/1.5 Arial,sans-serif}.widget{max-width:330px;margin:26px auto 0;padding:17px;background:linear-gradient(130deg,#4a3020,#1b1511);border:2px solid #b38e55;border-radius:22px;box-shadow:0 10px 25px #0008}.widget h3{font-weight:normal;color:var(--gold);margin:0 0 12px}.widget-inner{display:flex;gap:12px;align-items:center}.widget-inner .cover{width:76px;flex:none}.widget small{color:var(--muted);font-family:Arial,sans-serif}.section-title{text-align:center;color:var(--gold);font-weight:normal;font-size:20px;margin:30px 0 10px}#file{display:none}@media(max-width:480px){.books{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 9px}.cover{padding:8px}.shell{padding:16px 12px 65px}.shelf{border-width:7px}.book-label{font-size:11px}}
</style></head><body><main class="shell"><header><div class="ornament">✦ ❦ ✦</div><h1>My Little Library</h1><p>Between pages, a thousand worlds await</p></header><div class="line"></div><div class="toolbar"><input class="search" id="search" placeholder="⌕ Buscar livros ou autores…" aria-label="Buscar livros"><select id="filter" aria-label="Filtrar livros"><option value="all">Todos os livros</option><option value="reading">Lendo agora</option><option value="read">Já li</option><option value="want">Quero ler</option></select><button class="btn" id="add">+ Livro</button><button class="btn secondary" id="import">Importar CSV</button><input type="file" id="file" accept=".csv,text/csv"></div><div class="stats" id="stats"></div><section class="shelf"><div class="books" id="books"></div><div class="plank"></div></section><h2 class="section-title">✦ Seu cantinho de leitura ✦</h2><div class="widget" id="widget"></div><p class="hint" style="text-align:center">Prévia do futuro widget do iPhone — ainda não é um widget instalado.</p><div class="toolbar"><button class="btn secondary" id="export">Exportar biblioteca CSV</button><button class="btn secondary" id="reset">Restaurar exemplos</button></div><p class="footer">❧ Every book is a doorway ❧</p></main><div class="modal-back" id="back"><div class="modal"><h2 id="modal-title">Adicionar livro</h2><form id="form"><label class="field">Título<input name="title" required maxlength="150"></label><label class="field">Autor<input name="author" maxlength="120"></label><label class="field">URL da capa (opcional)<input name="cover" type="url" placeholder="https://..."></label><label class="field">Status<select name="status"><option value="want">Quero ler</option><option value="reading">Lendo agora</option><option value="read">Já li</option></select></label><label class="field">Progresso (%)<input name="progress" type="number" min="0" max="100" value="0"></label><div class="actions"><button class="btn" type="submit">Salvar livro</button><button class="btn secondary" type="button" id="cancel">Cancelar</button><button class="btn secondary" type="button" id="delete" style="display:none">Excluir</button></div></form></div></div><script>
const KEY='mll-library-v1';const examples=[{title:'Corte de Espinhos e Rosas',author:'Sarah J. Maas',status:'read',progress:100},{title:'Trono de Vidro',author:'Sarah J. Maas',status:'read',progress:100},{title:'De Sangue e Cinzas',author:'Jennifer L. Armentrout',status:'reading',progress:35},{title:'Quarta Asa',author:'Rebecca Yarros',status:'want',progress:0},{title:'Corte de Névoa e Fúria',author:'Sarah J. Maas',status:'read',progress:100}];let books;try{books=JSON.parse(localStorage.getItem(KEY))||examples.map((b,i)=>({...b,id:i+1}))}catch{books=examples.map((b,i)=>({...b,id:i+1}))}let editing=null;const $=id=>document.getElementById(id);const palettes=[['#264b47','#0d2326'],['#6b2934','#27121d'],['#48315e','#1b132c'],['#7c512c','#28180f'],['#354d6a','#151e30'],['#59623a','#252a17']];function save(){localStorage.setItem(KEY,JSON.stringify(books))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cover(b){const i=String(b.title).split('').reduce((a,c)=>a+c.charCodeAt(0),0)%palettes.length;return `<div class="cover" style="--c1:${palettes[i][0]};--c2:${palettes[i][1]}">${b.cover?`<img src="${esc(b.cover)}" alt="" onerror="this.remove()">`:''}<span class="name">${esc(b.title)}</span><span class="author">${esc(b.author)}</span></div>`}function render(){const q=$('search').value.toLocaleLowerCase(),f=$('filter').value;const shown=books.filter(b=>(f==='all'||b.status===f)&&[b.title,b.author].join(' ').toLocaleLowerCase().includes(q));$('books').innerHTML=shown.length?shown.map(b=>`<button class="book" data-id="${b.id}">${cover(b)}<span class="book-label">${esc(b.title)}</span></button>`).join(''):'<div class="empty">Nenhum livro encontrado. Que tal adicionar um?</div>';$('stats').innerHTML=`<span><strong>${books.length}</strong> livros</span><span><strong>${books.filter(b=>b.status==='reading').length}</strong> lendo</span><span><strong>${books.filter(b=>b.status==='read').length}</strong> lidos</span><span><strong>${books.filter(b=>b.status==='want').length}</strong> na lista</span>`;const current=books.find(b=>b.status==='reading')||books[0];$('widget').innerHTML=`<h3>☾ Lendo agora</h3>${current?`<div class="widget-inner">${cover(current)}<div><strong>${esc(current.title)}</strong><p><small>${esc(current.author)}</small></p><small>${Number(current.progress)||0}% concluído</small></div></div>`:'<small>Adicione seu primeiro livro</small>'}`;document.querySelectorAll('.book').forEach(el=>el.onclick=()=>openForm(books.find(b=>String(b.id)===el.dataset.id)))}function openForm(b){editing=b?.id??null;$('form').reset();$('modal-title').textContent=b?'Editar livro':'Adicionar livro';for(const key of ['title','author','cover','status','progress'])if(b)$('form').elements[key].value=b[key]??'';$('delete').style.display=b?'':'none';$('back').classList.add('open')}function close(){ $('back').classList.remove('open') }$('add').onclick=()=>openForm();$('cancel').onclick=close;$('back').onclick=e=>{if(e.target===$('back'))close()};$('search').oninput=render;$('filter').onchange=render;$('form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const b={id:editing??Date.now(),title:String(fd.get('title')).trim(),author:String(fd.get('author')).trim(),cover:String(fd.get('cover')).trim(),status:fd.get('status'),progress:Math.min(100,Math.max(0,Number(fd.get('progress'))||0))};if(!b.title)return;if(editing!==null)books=books.map(x=>x.id===editing?b:x);else books.push(b);save();render();close()};$('delete').onclick=()=>{if(confirm('Excluir este livro?')){books=books.filter(b=>b.id!==editing);save();render();close()}};function parseCSV(str){let rows=[],row=[],field='',quoted=false;for(let i=0;i<str.length;i++){const c=str[i];if(c==='"'){if(quoted&&str[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&str[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}function csvEscape(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));const headers=(rows.shift()||[]).map(s=>s.trim().toLowerCase());const ix=(...names)=>headers.findIndex(h=>names.includes(h));const ti=ix('title','título','titulo','book title'),au=ix('author','autor','authors'),st=ix('status','estado'),pr=ix('progress','progresso'),co=ix('cover','capa','cover url');if(ti<0){alert('CSV precisa ter coluna title (ou título).');return}let n=0;for(const r of rows){const title=(r[ti]||'').trim();if(!title||books.some(b=>b.title.toLowerCase()===title.toLowerCase()))continue;const raw=(r[st]||'want').trim().toLowerCase();const status=['reading','read','want'].includes(raw)?raw:({'lendo':'reading','lido':'read','quero ler':'want'}[raw]||'want');books.push({id:Date.now()+n,title,author:au<0?'':r[au]||'',status,progress:pr<0?0:Number(r[pr])||0,cover:co<0?'':r[co]||''});n++}save();render();alert(`${n} livro(s) importado(s).`);e.target.value=''};$('export').onclick=()=>{const data=[['title','author','status','progress','cover'],...books.map(b=>[b.title,b.author,b.status,b.progress,b.cover||''])].map(row=>row.map(csvEscape).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+data],{type:'text/csv;charset=utf-8'}));a.download='my-little-library.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('reset').onclick=()=>{if(confirm('Substituir sua biblioteca pelos livros de demonstração?')){books=examples.map((b,i)=>({...b,id:i+1}));save();render()}};render();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
